name: Test and Release

on:
    push:
        branches:
            - '*'
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous runs of the same branch/PR when a new commit arrives
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Type check and validation of package.json / io-package.json
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ubuntu-latest
        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '22.x'
                  type-checking: true
                  lint: false

    # Unit tests and integration tests (adapter started in a real js-controller)
    adapter-tests:
        needs: [check-and-lint]
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                node-version: [20.x, 22.x, 24.x]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  build: true
                  unit-test-check-pattern: 'test:ts'
                  unit-test-command: 'npm run test:ts'
